version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dresync_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dresync
      POSTGRES_PASSWORD: dresync
      POSTGRES_DB: dresync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dresync"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dresync_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://dresync:dresync@db:5432/dresync
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dresync_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
